name: Android Build

# Воркфлоу запускается при пуше или создании пул-реквеста в ветку main
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем исходный код репозитория
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Устанавливаем Java (JDK 17 — стандарт для современных версий Gradle/Android)
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 3. Настраиваем кеш сборки Gradle (зависимости, wrapper и build cache)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}

    # 3.1. Кешируем Android NDK/CMake, чтобы не скачивать их при каждом запуске
    - name: Cache Android NDK and CMake
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.ANDROID_HOME }}/ndk
          ${{ env.ANDROID_HOME }}/cmake
        key: ${{ runner.os }}-android-ndk-${{ hashFiles('TMessagesProj/build.gradle') }}

    # 4. Даем права на выполнение скрипту Gradle (необходимо для Linux окружения)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. Запускаем сборку дебаг-версии APK
    - name: Build with Gradle
      run: ./gradlew assembleDebug --build-cache

    # 5. Сохраняем готовый APK как артефакт сборки GitHub
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/"
